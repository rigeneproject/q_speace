name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check q_speace tests
      - name: Format (black)
        run: black --check q_speace tests
      - name: Type check (mypy)
        run: mypy q_speace
      - name: Compile check
        run: python -m compileall -q q_speace
      - name: Test (pytest)
        run: pytest -q
      - name: Generate CycloneDX SBOM (T240)
        run: |
          python -c "import json; from pathlib import Path; from q_speace.singularity import build_runtime_sbom; Path('sbom-cyclonedx.json').write_text(json.dumps(build_runtime_sbom(), indent=2, sort_keys=True), encoding='utf-8')"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: q-speace-sbom-cyclonedx
          path: sbom-cyclonedx.json
