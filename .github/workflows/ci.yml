name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check q_speace tests
      - name: Format (black)
        run: black --check q_speace tests
      - name: Type check (mypy)
        run: mypy q_speace
      - name: Compile check
        run: python -m compileall -q q_speace
      - name: Test (pytest)
        run: pytest -q
      - name: Generate versioned CycloneDX SBOM & SHA-256 checksum (T240/T241)
        run: |
          python -c "import hashlib, json; from pathlib import Path; from q_speace.singularity import build_runtime_sbom; raw = json.dumps(build_runtime_sbom(), indent=2, sort_keys=True); p = Path('sbom-cyclonedx.json'); p.write_text(raw, encoding='utf-8'); Path('sbom-cyclonedx.json.sha256').write_text(hashlib.sha256(raw.encode('utf-8')).hexdigest() + '  sbom-cyclonedx.json\n', encoding='utf-8')"
      - name: Dependency CVE scan (pip-audit, T241)
        continue-on-error: true
        run: |
          python -m pip install --quiet pip-audit
          pip-audit --format json --output cve-audit-report.json --progress-spinner off
      - name: Upload SBOM, checksum & CVE report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: q-speace-sbom-and-cve-audit
          path: |
            sbom-cyclonedx.json
            sbom-cyclonedx.json.sha256
            cve-audit-report.json
